{{- if eq .Values.inventory.discovery.scope "Cluster" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-inventory" .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-inventory" .Release.Name }}
subjects:
- kind: ServiceAccount
  name: {{ printf "%s-inventory" .Release.Name }}
  namespace: {{ .Release.Namespace }}
{{- end }}
