{{- $root := . -}}
{{- $namespaces := .Values.inventory.discovery.namespaces -}}
{{- if and (eq .Values.inventory.discovery.scope "Custom") $namespaces }}
{{- range $ns := $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-inventory-secrets" $root.Release.Name }}
  namespace: {{ $ns }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: [{{ printf "%s-inventory-config" $root.Release.Name | quote }}]
  verbs: ["get", "update", "patch"]
- apiGroups: ["virtualization.deckhouse.io"]
  resources: ["virtualmachines"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-inventory-secrets" $root.Release.Name }}
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-inventory-secrets" $root.Release.Name }}
subjects:
- kind: ServiceAccount
  name: {{ printf "%s-inventory" $root.Release.Name }}
  namespace: {{ $root.Release.Namespace }}
{{- end }}
{{- end }}
